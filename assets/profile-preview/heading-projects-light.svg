<svg xmlns="http://www.w3.org/2000/svg" width="900" height="30" viewBox="0 0 900 30" role="img" aria-labelledby="title desc">
  <title id="title">heading-projects — GitHub profile</title>
  <desc id="desc">GitHub profile graphic. Statistics are generated from GitHub data and refreshed daily.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .ink { fill: #424a53; }
    .muted { fill: #6e7781; }
    .rule { stroke: #d0d7de; stroke-width: 1; }
    .track { fill: #d0d7de; }
    .plot { stroke: #6e7781; stroke-dasharray: 4000; }
    @media (prefers-reduced-motion: reduce) {
      .plot { stroke-dasharray: none; }
    }
  </style>
  <text x="0" y="20" class="ink" font-size="16" text-anchor="start" font-weight="600">featured projects</text><line x1="190" y1="15" x2="900" y2="15" class="rule"/>
</svg>
